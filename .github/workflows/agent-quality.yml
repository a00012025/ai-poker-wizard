name: Agent quality guard

on:
  pull_request:

jobs:
  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest coverage
      - run: python scripts/agent_change_guard.py --base "origin/${{ github.base_ref }}"
      - run: pytest -q tests/test_agent_change_guard.py
      - run: coverage run -m pytest -q tests/test_chat_workflow_contract.py
      - run: coverage report

[pytest]
testpaths = tests scripts/regression_tests
pythonpath = . src scripts
addopts = -ra -m "not external and not gtow and not ocr"
markers =
    integration: exercises multiple local subsystems; stays in the offline default unless paired with an external marker.
    external: requires network or an external service.
    db: requires a real database.
    gtow: requires live GTO Wizard access or a prewarmed untracked solver cache.
    telegram: exercises Telegram bot/API behavior.
    ocr: OCR/image pipeline tests; may need optional CV/model artifacts.

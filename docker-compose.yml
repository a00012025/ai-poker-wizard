services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./.tokens.json:/app/.tokens.json
      - ./.game_modes_cache.json:/app/.game_modes_cache.json
      # GTOW raw hand-detail archive: read by the weekly queue scan to build
      # review-item /solutions Study links; also persists the daily ingest's
      # archive writes on the host (previously ephemeral in the container).
      - ./data/gtow_raw:/app/data/gtow_raw
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 15m
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('https://api.telegram.org', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

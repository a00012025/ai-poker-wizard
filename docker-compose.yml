services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./.tokens.json:/app/.tokens.json
      - ./.game_modes_cache.json:/app/.game_modes_cache.json
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 15m
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('https://api.telegram.org', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
